name: Update Okinawa Health Data
on:
  schedule:
    # Okinawa official weekly report is normally published Friday around 11:00 JST.
    # Retry later the same day, plus one Saturday fallback, so a delayed release is not missed.
    - cron: '30 2,5,8 * * 5'
    - cron: '30 2 * * 6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "okinawa-health-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Auto-update Okinawa health data"
          git push
